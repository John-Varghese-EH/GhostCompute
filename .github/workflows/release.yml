name: Release GhostCompute

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux x86_64 Dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Linux ARM64 Cross-Compilation Dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i -E 's/^deb (http|https)/deb [arch=amd64,i386] \1/' /etc/apt/sources.list
          sudo sed -i -E 's/^deb-src (http|https)/deb-src [arch=amd64,i386] \1/' /etc/apt/sources.list
          for f in /etc/apt/sources.list.d/*.list; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's/^deb (http|https)/deb [arch=amd64,i386] \1/' "$f" || true
              sudo sed -i -E 's/^deb-src (http|https)/deb-src [arch=amd64,i386] \1/' "$f" || true
            fi
          done
          cat << 'INNER_EOF' | sudo tee /etc/apt/sources.list.d/arm-cross-compile-sources.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          INNER_EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo apt-get install -y libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libappindicator3-dev:arm64 librsvg2-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🚀 GhostCompute ${{ github.ref_name }} - Enterprise AI Gateway'
          releaseBody: |
            ## 🚀 GhostCompute ${{ github.ref_name }} is here!
            
            GhostCompute empowers you to seamlessly transform any high-performance compute node into a centralized AI server, giving your lightweight laptops zero-latency access to heavy models from anywhere in the world.
            
            ### ✨ Highlights in this Release
            - **Peer-to-Peer WebRTC Tunneling**: Unmatched security and NAT traversal without exposing public IP addresses.
            - **Client-Side AI Gateway**: Transparently aggregate your local Ollama models with Cloud APIs (Gemini, Groq).
            - **Resilient Cloud Fallback**: If your Host disconnects, your IDE seamlessly falls back to Cloud models without dropping a single completion.
            - **OpenAI Compatible Endpoint**: Out-of-the-box compatibility with Cursor, Claude Code, Cline, and any other tool expecting an OpenAI endpoint!
            
            ### 📦 Downloads
            Expand the **Assets** section below to download the latest GhostCompute executable for your operating system (Windows, macOS, or Linux). We provide optimized native binaries for both x86_64 and ARM64 architectures!
            
            > **Note:** For installation instructions and configuration details, please see the [Documentation](https://github.com/${{ github.repository }}/tree/main/docs).
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  checksum:
    name: Generate Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Generate SHA256 checksums
        run: |
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.tar.gz' \) -exec sha256sum {} \; > checksums.sha256
          cat checksums.sha256
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.sha256
